<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>生活SOP</title><style>body{font:15px system-ui;margin:0;background:#f4f8f6;color:#26363a}main{max-width:900px;margin:auto;padding:25px}button{padding:9px 13px;border:0;border-radius:8px;background:#4d9082;color:white;cursor:pointer}input,textarea,select{padding:9px;border:1px solid #dce6e2;border-radius:7px;font:inherit}.top{display:flex;justify-content:space-between;align-items:start}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.stat,.card{background:white;border:1px solid #e2ebe7;border-radius:12px;padding:15px}.stat b{font-size:25px;display:block}.toolbar{display:flex;gap:8px;margin:15px 0}.search{flex:1}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{position:relative}.card h3{margin:0 20px 8px 0}.tag{color:#34776a;background:#dcf0ea;border-radius:15px;padding:3px 8px;font-size:12px}.meta,.muted{color:#768582;font-size:13px}.progress{height:7px;background:#edf1ef;border-radius:8px;margin:13px 0}.progress i{display:block;height:100%;background:#4d9082;border-radius:8px}.foot{display:flex;justify-content:space-between}.open{background:none;color:#4d9082;padding:0}.delete{position:absolute;right:8px;top:7px;background:none;color:#9aa8a4;font-size:18px}.empty{text-align:center;color:#87938f;padding:40px;grid-column:1/-1}dialog{border:0;border-radius:14px;width:min(560px,calc(100% - 20px));padding:0}dialog::backdrop{background:#19372c66}.modal{padding:22px}.field{display:grid;gap:5px;margin:10px 0}.field textarea{min-height:75px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.secondary{background:white;color:#37534c;border:1px solid #dce6e2}.steps{display:grid;gap:7px}.step{padding:8px;background:#f5f9f7;border-radius:7px}.attach img{max-width:100%;max-height:150px}.attach audio{width:100%}@media(max-width:650px){main{padding:16px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{display:grid}.top h1{font-size:25px}}</style><style>@media(max-width:650px){body{background:#f3f7f5;padding-bottom:76px}main{padding:18px 14px 28px}.top{align-items:center}.top h1{font-size:24px}.top>button{width:44px;height:44px;border-radius:50%;font-size:0;padding:0}.top>button:after{content:"＋";font-size:23px}.stats{display:flex;overflow:auto;gap:9px;margin:10px 0 14px}.stat{min-width:108px;padding:13px;border-radius:16px}.stat b{font-size:22px}.toolbar{display:flex}.search{min-width:0;border-radius:18px}.grid{display:block}.card{margin-bottom:11px;border-radius:17px;box-shadow:0 5px 18px #29483d0d}.mobile-nav{position:fixed;z-index:10;left:10px;right:10px;bottom:10px;height:62px;border:1px solid #e1ebe7;border-radius:20px;background:#fffffff2;display:flex;justify-content:space-around;align-items:center;box-shadow:0 8px 28px #29483d22}.mobile-nav button{background:none;color:#7b8985;padding:6px 12px;font-size:11px}.mobile-nav b{display:block;font-size:19px;line-height:20px}.mobile-nav .active{color:#347e70;font-weight:700}dialog{width:calc(100% - 16px);border-radius:20px}}</style><main><div class="top"><div><small class="muted">PERSONAL OPERATING SYSTEM</small><h1>我的生活 SOP</h1><p class="muted">把重复的生活经验变成轻松可执行的步骤。</p></div><button id="add">＋ 新建</button></div><section class="stats"><div class="stat"><b id="total">0</b><small>全部流程</small></div><div class="stat"><b id="done">0</b><small>今日完成</small></div><div class="stat"><b id="rate">0%</b><small>今日完成率</small></div><div class="stat"><b id="streak">0天</b><small>连续打卡</small></div></section><div class="toolbar"><input class="search" id="search" placeholder="搜索…"><button id="tools">工具</button></div><section class="grid" id="list"></section></main><dialog id="formDlg"><form class="modal" id="form"><h2>新建 SOP</h2><div class="field"><label>名称</label><input name="title" required></div><div class="field"><label>分类</label><select name="cat"><option>早晨</option><option>家务</option><option>健康</option><option>工作</option><option>其他</option></select></div><div class="field"><label>步骤（每行一个）</label><textarea name="steps" required></textarea></div><div class="field"><label>备注</label><textarea name="notes"></textarea></div><div class="field"><label>图片或语音</label><input type="file" name="file" accept="image/*,audio/*"></div><div class="field"><label>每日提醒</label><input type="time" name="remind"></div><div class="actions"><button type="button" class="secondary" id="cancel">取消</button><button>保存</button></div></form></dialog><dialog id="detailDlg"><div class="modal"><h2 id="dt"></h2><p class="muted" id="dm"></p><div class="steps" id="ds"></div><div class="attach" id="da"></div><p class="muted" id="dn"></p><div class="actions"><button id="close">关闭</button></div></div></dialog><dialog id="toolDlg"><div class="modal"><h2>工具</h2><p class="muted">模板、备份、提醒和安装。</p><div class="actions"><button class="secondary" data-t="晨间启动">＋晨间模板</button><button class="secondary" data-t="睡前放松">＋睡前模板</button></div><div class="actions"><button class="secondary" id="notify">开启提醒</button><button class="secondary" id="install">安装应用</button><button id="export">导出备份</button><label class="secondary">导入备份<input id="import" type="file" accept=".json" hidden></label></div><div class="actions"><button class="secondary" id="toolClose">关闭</button></div></div></dialog><nav class="mobile-nav"><button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><b>⌂</b>今天</button><button onclick="document.getElementById('add').click()"><b>＋</b>新建</button><button onclick="document.getElementById('tools').click()"><b>⚙</b>设置</button></nav><script>
const $=s=>document.querySelector(s),day=()=>new Date().toISOString().slice(0,10);let d=JSON.parse(localStorage.getItem("life-sop-v3")||"null")||[{id:1,title:"出门前检查清单",cat:"其他",steps:["钥匙、手机、钱包","关闭燃气和电器","确认门窗已锁"],notes:"出门前花30秒确认。",done:0,days:[],file:null,remind:""}],cur;function save(){localStorage.setItem("life-sop-v3",JSON.stringify(d));render()}function streak(){let n=0,t=new Date();while(d.some(x=>x.days?.includes(t.toISOString().slice(0,10)))){n++;t.setDate(t.getDate()-1)}return n}function render(){let q=$("#search").value.toLowerCase(),a=d.filter(x=>(x.title+x.steps.join(" ")).toLowerCase().includes(q)),n=d.filter(x=>x.days?.includes(day())).length;$("#total").textContent=d.length;$("#done").textContent=n;$("#rate").textContent=d.length?Math.round(n/d.length*100)+"%":"0%";$("#streak").textContent=streak()+"天";$("#list").innerHTML=a.length?a.map(x=>{let p=x.days?.includes(day())?100:Math.round(x.done/x.steps.length*100);return `<article class="card"><button class="delete" data-del="${x.id}">×</button><h3>${x.title}</h3><div class="meta"><span class="tag">${x.cat}</span> · ${x.steps.length}步 ${x.remind?"·⏰"+x.remind:""}</div><div class="progress"><i style="width:${p}%"></i></div><div class="foot"><span>${x.days?.includes(day())?"今日已打卡":x.done+"/"+x.steps.length+"步"}</span><button class="open" data-open="${x.id}">执行 →</button></div></article>`}).join(""):"<div class='empty'>暂无 SOP</div>"}function readFile(f){return f?new Promise(r=>{let x=new FileReader;x.onload=()=>r({name:f.name,type:f.type,data:x.result});x.readAsDataURL(f)}):null}function detail(id){cur=d.find(x=>x.id==id);$("#dt").textContent=cur.title;$("#dm").textContent=cur.cat+(cur.remind?" · 每日提醒 "+cur.remind:"");$("#ds").innerHTML=cur.steps.map((s,i)=>`<label class="step"><input type="checkbox" data-i="${i}" ${i<cur.done?"checked":""}> ${s}</label>`).join("")+`<button id="check">${cur.days?.includes(day())?"今日已打卡":"完成并打卡今天"}</button>`;$("#dn").textContent=cur.notes||"";$("#da").innerHTML=cur.file?(cur.file.type.startsWith("image")?`<img src="${cur.file.data}">`:`<audio controls src="${cur.file.data}"></audio>`):"";$("#detailDlg").showModal()}$("#add").onclick=()=>$("#formDlg").showModal();$("#cancel").onclick=()=>$("#formDlg").close();$("#close").onclick=()=>$("#detailDlg").close();$("#tools").onclick=()=>$("#toolDlg").showModal();$("#toolClose").onclick=()=>$("#toolDlg").close();$("#form").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);d.unshift({id:Date.now(),title:f.get("title"),cat:f.get("cat"),steps:f.get("steps").split("\n").filter(Boolean),notes:f.get("notes"),done:0,days:[],file:await readFile(f.get("file")),remind:f.get("remind")});e.target.reset();$("#formDlg").close();save()};$("#search").oninput=render;document.addEventListener("click",e=>{if(e.target.closest("[data-open]"))detail(e.target.closest("[data-open]").dataset.open);let z=e.target.closest("[data-del]");if(z&&confirm("删除？")){d=d.filter(x=>x.id!=z.dataset.del);save()}if(e.target.id==="check"){if(!cur.days)cur.days=[];if(!cur.days.includes(day()))cur.days.push(day());save();detail(cur.id)}let t=e.target.closest("[data-t]");if(t){let v=t.dataset.t==="晨间启动"?{title:"晨间启动",cat:"早晨",steps:["喝水","整理床铺","查看今日三件重要事项"]}:{title:"睡前放松",cat:"健康",steps:["放下手机","准备明天衣物","记录今日值得感谢的一件事"]};d.unshift({...v,id:Date.now(),notes:"",done:0,days:[],file:null,remind:""});save();$("#toolDlg").close()}});document.addEventListener("change",e=>{if(e.target.matches("[data-i]")){cur.done=[...$("#ds").querySelectorAll("input")].filter(x=>x.checked).length;save()}});$("#export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="生活SOP备份-"+day()+".json";a.click()};$("#import").onchange=e=>{let r=new FileReader;r.onload=()=>{d=JSON.parse(r.result);save();alert("导入成功")};r.readAsText(e.target.files[0])};$("#notify").onclick=async()=>alert("提醒功能已预留：点击允许通知后，请保持应用运行。");$("#install").onclick=()=>alert("可使用浏览器菜单“安装应用/添加到主屏幕”。");render();
</script></html>
